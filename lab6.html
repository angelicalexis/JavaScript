<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Lab 6</title>
    <style>*{font-family:Roboto,Helvetica,Arial,sans-serif;}body{padding:10px;}</style>
  </head>
  <body>
    <h1>IT-2320<br>Lab 6 - AJAX, Frameworks, promises</h1>
    <h2>Student Name: </h2>
    <p>
      AJAX Response:<br>
      <div id="ajax"></div>
    </p>
    <p>
      Fetch Response:<br>
      <div id="fetch"></div>
    </p>
    <script>
      
      // part 1
      const ajax = document.getElementById("ajax");

      function loadDoc(){
        const req1 = new XMLHttpRequest();
        req1.onload = function () {
            ajax.innerHTML = req1.responseText;
        };
      
        req1.open("GET", "ajax.txt", true);
        req1.send();
      };

      loadDoc();

      // part 2
      const goGet = document.getElementById("fetch");

      fetch("fetch.txt")
        .then(response => response.text())
        .then(text => goGet.innerHTML = text)
        
        .catch(error => {
          goGet.innerHTML = "Fetch error: " + error;
        });
      </script>
  </body>
</html>
